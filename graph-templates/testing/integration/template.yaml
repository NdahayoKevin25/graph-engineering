id: testing.integration
name: Integration Test Database Setup
version: 1.0.0
description: >
  Tests that hit a REAL Postgres database, as opposed to testing.unit's
  mocked repository layer. Provides a testDatabase helper that connects to
  an explicit TEST_DATABASE_URL using the standard Node PostgreSQL driver.
  Guarded cleanup truncates only explicitly named public-schema tables in
  one statement without CASCADE. No application database fallback is allowed.
category: testing
subcategory: integration
status: implemented
type: graph-node
actions: [generate, detect, validate, test]

inputs: []

outputs:
  - { name: files, type: array<string>, description: "tests/setup/testDatabase.ts" }
  - { name: exports, type: array<string>, description: "getTestDatabase, truncateAllTables, closeTestDatabase" }

dependencies:
  packages:
    - { name: pg, version: "^8.23.0" }
    - { name: "@types/pg", version: "^8.23.1", dev: true }
    - { name: drizzle-orm, version: "^0.45.3" }
  services: [postgres]
  templates:
    - { id: database.neon-postgres.connection, relationship: requires }

environment:
  variables:
    - { name: TEST_DATABASE_URL, required: true, secret: true, description: "Explicit disposable PostgreSQL database ending in _test. Never falls back to DATABASE_URL.", usedBy: [testing.integration] }
    - { name: GRAPH_TEST_DATABASE_ALLOW_TRUNCATE, required: false, secret: false, description: "Set to 1 only in disposable test environments to permit destructive table cleanup.", usedBy: [testing.integration] }

files:
  create:
    - { path: tests/setup/testDatabase.ts, source: files/testDatabase.ts }
  modify: []

compatible_with:
  upstream: [database.neon-postgres.connection]
  downstream: [backend.repository, api.crud]

consumes:
  artifacts: [database.schema]
produces:
  artifacts: [test.schema]

idempotency:
  strategy: detect-and-skip
  detection: "tests/setup/testDatabase.ts exists"

validation:
  checks:
    - { type: file-exists, path: tests/setup/testDatabase.ts }
    - { type: exports, path: tests/setup/testDatabase.ts, names: [getTestDatabase, truncateAllTables, closeTestDatabase] }
    - { type: build, command: "npm run build" }

testing:
  strategy: integration
  location: tests/testDatabase.test.ts
  command: "npm test -- testDatabase"

security:
  considerations:
    - "NODE_ENV must equal test and TEST_DATABASE_URL must explicitly name a database ending in _test; DATABASE_URL is never a fallback. Matching application targets are rejected even if credentials differ."
    - "Cleanup additionally requires GRAPH_TEST_DATABASE_ALLOW_TRUNCATE=1. All table identifiers are bounded and validated before any connection. Only listed public-schema tables are truncated, atomically, without CASCADE."
    - "URL driver overrides and certificate filesystem paths are rejected. Database naming and URL comparisons are defense in depth, not proof of isolation: operators must provision a disposable database and a role with no production access."

documentation:
  required: [README.md]
