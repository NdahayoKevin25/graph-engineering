id: database.neon-postgres.connection
name: Neon PostgreSQL Connection (Drizzle)
version: 1.0.0
description: >
  A bounded standard PostgreSQL pool for persistent Node24 processes, including
  Neon, using pg and Drizzle with certificate verification. Includes explicit
  operation URL guards and credential-free offline migration generation.
category: database
subcategory: neon-postgres
status: implemented
type: graph-node
actions: [generate, detect, validate, test]

inputs: []

outputs:
  - { name: files, type: array<string>, description: "src/config/database.ts, src/config/schema.ts, drizzle.config.ts" }
  - { name: exports, type: array<string>, description: "database, pool" }

dependencies:
  packages:
    - { name: pg, version: "8.23.0" }
    - { name: drizzle-orm, version: "0.45.3" }
    - { name: "@types/pg", version: "8.23.1", dev: true }
    - { name: drizzle-kit, version: "0.31.11", dev: true }
  services: [postgres]
  templates:
    - { id: project.node-express, relationship: requires }

environment:
  variables:
    - { name: DATABASE_URL, required: true, secret: true, description: "Explicit standard PostgreSQL URL. No alias fallback; TLS certificates are verified for remote targets.", usedBy: [database.neon-postgres.connection] }

files:
  create:
    - { path: src/config/database.ts, source: files/database.ts }
    - { path: src/config/database-url.ts, source: files/database-url.ts }
    - { path: src/config/schema.ts, source: files/schema.ts }
    - { path: drizzle.config.ts, source: files/drizzle.config.ts }
  modify:
    - { path: src/utils/helpers.ts, operation: insert-before-marker, marker: "// ENV-VAR-FIELDS:", template: "  DATABASE_URL: string;" }
    - { path: src/utils/helpers.ts, operation: insert-into-array, marker: "requiredEnvironmentVariables", template: "'DATABASE_URL'" }
    - { path: src/utils/helpers.ts, operation: insert-before-marker, marker: "// ENV-VAR-VALUES:", template: '  DATABASE_URL: process.env.DATABASE_URL!,' }
    - { path: package.json, operation: merge-json, template: '{"scripts":{"dbGenerate":"drizzle-kit generate"},"overrides":{"@esbuild-kit/core-utils":{"esbuild":"0.25.12"}}}' }

compatible_with:
  upstream: [project.node-express]
  downstream: [backend.repository, database.migrations, database.transactions, database.seed]

consumes:
  artifacts: [architecture.schema]
produces:
  artifacts: [database.schema]

idempotency:
  strategy: detect-and-skip
  detection: "src/config/database.ts exists and exports database"

validation:
  checks:
    - { type: file-exists, path: src/config/database.ts }
    - { type: file-exists, path: src/config/schema.ts }
    - { type: file-exists, path: drizzle.config.ts }
    - { type: exports, path: src/config/database.ts, names: [database, pool] }
    - { type: build, command: "npm --ignore-scripts run build", sandbox: docker }

testing:
  strategy: unit
  location: tests/database-connection.test.ts
  command: "npm test -- database-connection"

security:
  considerations:
    - "DATABASE_URL is a secret — never logged, never committed; only referenced via SECRETS which reads it from process.env."
    - "Uses standard pg/TLS transport for Node24, not the Neon WebSocket/edge driver. Remote TLS requires certificate verification; URL flags cannot weaken it."
    - "Unencrypted numeric loopback is permitted only with NODE_ENV development/test and GRAPH_DATABASE_ALLOW_LOCAL=1. Rendering never connects or installs packages."
    - "The Pool is a module-level singleton (one per process) — never construct a second Pool for the same DATABASE_URL, which would exhaust Neon's connection limits under load."

documentation:
  required: [README.md]
