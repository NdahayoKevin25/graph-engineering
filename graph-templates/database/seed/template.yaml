id: database.seed
name: Database Seed Script
version: 1.0.0
description: >
  Generates a standalone src/scripts/seed.ts that inserts example rows for
  one or more entities backend.repository created, runnable via `npm run seed`.
  Requires an explicitly acknowledged isolated loopback development/test
  database with a separate URL. Inserts all rows transactionally into empty
  targets, refusing existing data rather than silently duplicating or replacing it.
category: database
subcategory: seed
status: implemented
type: graph-node
actions: [generate, modify, validate]

inputs:
  - name: entities
    type: "array<object>"
    required: true
    description: "[{ entityName, tableExportName, sampleRows: array<object> }] — one entry per entity to seed."

outputs:
  - { name: files, type: array<string>, description: "src/scripts/seed.ts, package.json (modified)" }

dependencies:
  packages: []
  services: []
  templates:
    - { id: database.neon-postgres.connection, relationship: requires }
    - { id: backend.repository, relationship: extends }

environment:
  variables: []

files:
  create:
    - { path: src/scripts/seed.ts, source: files/seed.ts.template }
  modify:
    - { path: package.json, operation: merge-json, template: '{"scripts":{"seed":"node dist/scripts/seed.js"}}' }

compatible_with:
  upstream: [database.neon-postgres.connection, backend.repository]
  downstream: [testing.integration]

consumes:
  artifacts: [database.schema]
produces:
  artifacts: []

idempotency:
  strategy: detect-and-merge
  detection: "src/scripts/seed.ts exists — if so, `modify` appends a new entity's seed block rather than overwriting the file"

validation:
  checks:
    - { type: file-exists, path: src/scripts/seed.ts }
    - { type: build, command: "npm --ignore-scripts run build", sandbox: docker }
    - type: content-contains
      path: src/scripts/seed.ts
      pattern: "operationDatabaseOptions('seed')"
      description: "The central explicit environment/target/acknowledgement guard must be present."

testing:
  strategy: integration
  location: tests/seed.test.ts
  command: "npm test -- seed"

security:
  considerations:
    - "No DATABASE_URL fallback. SEED_DATABASE_URL must name numeric loopback, a database ending _test/_seed/_dev, NODE_ENV development/test, exact GRAPH_DATABASE_EXPECTED_NAME and GRAPH_DATABASE_SEED=isolated-seed-database. Remote seeds are unsupported."
    - "All entities insert in one transaction under an advisory lock. Nonempty targets fail closed; successful seeds are not silently rerun. No raw SQL/error/data logging."
    - "Sample data must never include real credentials or PII — sampleRows are literal fixture data supplied by the caller, this node does not fetch or fabricate real-looking personal data."

documentation:
  required: [README.md]
