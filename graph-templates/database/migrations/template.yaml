id: database.migrations
name: Drizzle Migration Workflow
version: 1.0.0
description: >
  Generates a guarded Drizzle migration runner with an explicit separate URL,
  expected database name, acknowledgement and advisory lock. Validates applied
  migration hashes before applying pending SQL transactionally. This is not
  an automatic inverse/down-migration generator.
category: database
subcategory: migrations
status: implemented
type: graph-node
actions: [generate, validate]

inputs: []

outputs:
  - { name: files, type: array<string>, description: "src/migrations/.gitkeep, src/migrations/README.md" }

dependencies:
  packages: []
  services: []
  templates:
    - { id: database.neon-postgres.connection, relationship: requires }

environment:
  variables: []

files:
  create:
    - { path: src/migrations/.gitkeep, source: files/gitkeep }
    - { path: src/migrations/README.md, source: files/README-migrations.md }
    - { path: src/scripts/migrate.ts, source: files/migrate.ts }
  modify:
    - { path: package.json, operation: merge-json, template: '{"scripts":{"dbMigrate":"node dist/scripts/migrate.js"}}' }

compatible_with:
  upstream: [database.neon-postgres.connection, backend.repository]
  downstream: [devops.github-actions]

consumes:
  artifacts: [database.schema]
produces:
  artifacts: [database.schema]

idempotency:
  strategy: detect-and-skip
  detection: "src/migrations/README.md exists"

validation:
  checks:
    - { type: file-exists, path: src/migrations/README.md }
    - type: migration-pending-check
      command: "npm --ignore-scripts run dbGenerate"
      sandbox: docker
      description: "Must produce no new migration file when schema.ts and src/migrations/ are already in sync."

testing:
  strategy: integration
  location: tests/migrations.test.ts
  command: "npm test -- migrations"

security:
  considerations:
    - "dbMigrate uses only MIGRATION_DATABASE_URL, an exact GRAPH_DATABASE_EXPECTED_NAME, explicit NODE_ENV and GRAPH_DATABASE_MIGRATE=reviewed-migration. These declarations do not prove external approval or database classification."
    - "Failed PostgreSQL migration transactions roll back. Reverting an already committed migration needs a separately reviewed forward fix or restore plan; no automatic down command is provided."
    - "Migration files are generated output, not hand-edited — a hand-edited migration can silently diverge from schema.ts and break dbGenerate's drift detection this node's validation.checks relies on."

documentation:
  required: [README.md]
