id: frontend.react
name: Typed API Client for Vite React
version: 1.0.0
description: >
  Adds the audited typed API client to a project.vite-react application. The
  client shares frontend.nextjs's framework-independent apiFetch implementation:
  bounded /api/ paths, included cookie credentials, safe status errors and
  limited JSON requests and responses. This node does not add routing, login
  pages, forms, tables or dashboard integration.
category: frontend
subcategory: react
status: implemented
type: graph-node
actions: [generate, detect, validate, test]

inputs: []

outputs:
  - { name: files, type: array<string>, description: "lib/apiClient.ts" }
  - {
      name: exports,
      type: array<string>,
      description: "apiFetch, ApiError, ApiSuccess, ApiPaginated",
    }

dependencies:
  packages: []
  services: []
  templates:
    - { id: project.vite-react, relationship: requires }

environment:
  variables: []

files:
  create:
    - { path: lib/apiClient.ts, source: files/apiClient.ts }
  modify: []

compatible_with:
  upstream: [project.vite-react]
  downstream: []

consumes:
  artifacts: [api.schema]
produces:
  artifacts: []

idempotency:
  strategy: detect-and-skip
  detection: "lib/apiClient.ts exactly matches the audited client source"

validation:
  checks:
    - { type: file-exists, path: lib/apiClient.ts }
    - { type: exports, path: lib/apiClient.ts, names: [apiFetch, ApiError] }
    - { type: build, command: "npm run build" }

testing:
  strategy: unit
  location: tests/apiClient.test.ts
  command: "npm test -- apiClient"

security:
  considerations:
    - "The audited client accepts only bounded /api/ paths and a restricted request shape. It includes cookies, forbids redirects and cache, caps body and response size, and uses constant safe errors with the actual HTTP status. It never reads tokens from browser storage."
    - "The Vite root's VITE_API_URL is public build-time configuration, not a secret. Cookie-authenticated requests require a same-site frontend and API plus exact credentialed CORS and trusted-Origin review when their origins differ."
    - "No authentication UI, authorization policy, application routes or deployment configuration are supplied by this node."

documentation:
  required: [README.md]
