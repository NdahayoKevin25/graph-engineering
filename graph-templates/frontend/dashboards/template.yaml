id: frontend.dashboards
name: Dashboard Composition
version: 1.0.0
description: >
  A reusable authenticated dashboard composition: display-only role-filtered
  navigation, caller-supplied stat tiles, an optional table built on
  frontend.tables, and an optional profile form built on frontend.forms.
  Applications supply their own reviewed table path, rows, statistics and
  profile-save callback. No stats or profile endpoint is assumed or created.
category: frontend
subcategory: dashboards
status: implemented
type: graph-node
actions: [generate, detect, validate, test]

inputs: []

outputs:
  - { name: files, type: array<string>, description: "components/Dashboard.tsx and its test" }
  - { name: exports, type: array<string>, description: "Dashboard and typed prop contracts" }

dependencies:
  packages: []
  services: []
  templates:
    - { id: frontend.authentication, relationship: requires }
    - { id: frontend.tables, relationship: requires }
    - { id: frontend.forms, relationship: requires }

environment:
  variables: []

files:
  create:
    - { path: components/Dashboard.tsx, source: files/Dashboard.tsx }
  modify: []

compatible_with:
  upstream: [frontend.authentication, frontend.tables, frontend.forms]
  downstream: []

consumes:
  artifacts: [auth.schema, api.schema]
produces:
  artifacts: []

idempotency:
  strategy: detect-and-skip
  detection: "components/Dashboard.tsx exists with exact reviewed content"

validation:
  checks:
    - { type: file-exists, path: components/Dashboard.tsx }
    - { type: exports, path: components/Dashboard.tsx, names: [Dashboard] }
    - { type: build, command: "npm run build" }

testing:
  strategy: unit
  location: tests/Dashboard.test.tsx
  command: "npm test -- Dashboard"

security:
  considerations:
    - "Role-filtered navigation only changes display; backend authentication, row scope and authorization remain mandatory."
    - "No stats or profile API is generated. A caller-provided profile-save callback and table path require application review."
    - "The table child does not mount before the auth context reports an authenticated user; the backend must still enforce access."

documentation:
  required: [README.md]
