id: authorization.permissions
name: Granular Permission Gate
version: 1.0.0
description: >
  Generates a default-deny resource:action permission gate over a bounded,
  reviewed permission vocabulary. An application-owned hasPermission adapter
  resolves each authenticated user's current grants from durable trusted data.
  This node does not invent grant storage, grant-management endpoints, or route
  policy; the application must provide and review those separately.
category: authorization
subcategory: permissions
status: implemented
type: graph-node
actions: [generate, detect, validate, test]

inputs:
  - { name: permissions, type: array<string>, required: true, description: "Unique resource:action names to permit in route declarations (1-32)." }
outputs:
  - { name: files, type: array<string>, description: "Permission middleware and generated tests." }
  - { name: exports, type: array<string>, description: "PERMISSIONS and requirePermission." }

dependencies:
  packages:
    - { name: express, version: "^4.22.3" }
    - { name: vitest, version: "4.1.11", dev: true }
  services: []
  templates:
    - { id: authentication.jwt, relationship: requires }
    - { id: backend.error-handler, relationship: requires }
    - { id: authorization.rbac, relationship: extends }

environment:
  variables: []

files:
  create:
    - { path: src/middlewares/permissionMiddleware.ts, source: files/permissionMiddleware.ts.template }
  modify: []

compatible_with:
  upstream: [authentication.jwt, authorization.rbac, backend.error-handler]
  downstream: [backend.express, api.crud]

consumes:
  artifacts: [auth.schema]
produces:
  artifacts: []

idempotency:
  strategy: detect-and-skip
  detection: "Identical generated middleware and test already exist; divergent files require review."

validation:
  checks:
    - { type: file-exists, path: src/middlewares/permissionMiddleware.ts }
    - { type: exports, path: src/middlewares/permissionMiddleware.ts, names: [PERMISSIONS, requirePermission] }
    - { type: build, command: "npm run build" }

testing:
  strategy: unit
  location: tests/permissionMiddleware.test.ts
  command: "npm test -- permissionMiddleware"

security:
  considerations:
    - "Unknown permissions fail during route registration. Missing or invalid authenticated identities return 401; ungranted permissions return 403; grant-lookup failures return 503 without leaking adapter details. Only an explicit true grant continues."
    - "Mount authMiddleware before requirePermission on each protected route. No route is auto-protected and no grant-management endpoint or storage is generated. The app-owned authorizer must use trusted, current user-global grants and deny by default. Tenant-scoped resources require a separate reviewed tenant guard and tenant-scoped data access."

documentation:
  required: [README.md]
